name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tools
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -r requirements-security.txt "detect-secrets==1.5.0"
          python -m pip install --upgrade -r requirements.lock.txt

      - name: Scan tracked files for secrets
        shell: bash
        run: |
          # These content-derived identifiers are public audit metadata, not credentials.
          git ls-files -z | xargs -0 detect-secrets scan --all-files --no-verify --exclude-lines '"(snapshot_id|previous_snapshot_id|relative_path|sha256|release_id|fingerprint)"\s*:' > /tmp/secret-scan.json
          python - <<'PY'
          import json
          import sys

          with open('/tmp/secret-scan.json', encoding='utf-8') as handle:
              results = json.load(handle).get('results', {})

          findings = [
              (path, finding)
              for path, file_findings in results.items()
              for finding in file_findings
          ]
          print(f'secret findings={len(findings)}')
          for path, finding in findings:
              line = finding.get('line_number', 1)
              finding_type = finding.get('type', 'Potential secret')
              print(f'::error file={path},line={line}::{finding_type} candidate detected')
          sys.exit(1 if findings else 0)
          PY

      - name: Run static security analysis
        run: python -m bandit -r src run_all.py -ll

      - name: Run Ruff correctness gate
        run: python -m ruff check src tests run_all.py

      - name: Run test suite
        run: python -m pytest -q --basetemp "${RUNNER_TEMP}/cpbl-security-pytest"

  # Independent and mandatory: audit failure must not hide source validation.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tools
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -r requirements-security.txt "detect-secrets==1.5.0"
          python -m pip install --upgrade -r requirements.lock.txt

      - name: Audit Python dependencies
        run: python -m pip_audit --local --strict

  web-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Audit locked web dependencies
        run: npm audit --audit-level=low
