name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tools
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install pip-audit bandit "detect-secrets==1.5.0"
          python -m pip install --upgrade -r requirements.txt

      - name: Scan tracked files for secrets
        shell: bash
        run: |
          git ls-files -z | xargs -0 detect-secrets scan --all-files --no-verify > /tmp/secret-scan.json
          python - <<'PY'
          import json
          import sys

          with open('/tmp/secret-scan.json', encoding='utf-8') as handle:
              results = json.load(handle).get('results', {})

          findings = [
              (path, finding)
              for path, file_findings in results.items()
              for finding in file_findings
          ]
          print(f'secret findings={len(findings)}')
          for path, finding in findings:
              line = finding.get('line_number', 1)
              finding_type = finding.get('type', 'Potential secret')
              print(f'::error file={path},line={line}::{finding_type} candidate detected')
          sys.exit(1 if findings else 0)
          PY

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run static security analysis
        run: python -m bandit -r app.py src run_all.py -ll

      - name: Run test suite
        run: python -m pytest -q
