name: Verified official Streamlit runtime compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/streamlit-source.yml"
      - "scripts/verify_streamlit_candidate.py"
      - "scripts/test_streamlit_integration.py"
      - "tests/test_streamlit_source_contract.py"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-official-wheel:
    name: Verify official PyPI release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install fixed metadata parser
        run: python -m pip install "packaging==26.2"
      - name: Download official wheel from PyPI
        run: >-
          python -m pip download
          --index-url https://pypi.org/simple
          --only-binary=:all:
          --no-deps
          --dest candidate-wheel
          streamlit==1.66.1
      - name: Verify official release digest, metadata, and packaged UI
        run: >-
          python scripts/verify_streamlit_candidate.py
          --wheel-dir candidate-wheel
          --output candidate-wheel
      - name: Retain verified official wheel and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamlit-1.66.1-official
          path: |
            candidate-wheel/streamlit-1.66.1-py3-none-any.whl
            candidate-wheel/provenance.json
            candidate-wheel/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  integration:
    name: Candidate integration (${{ matrix.project.repo }}, ${{ matrix.os }})
    needs: verify-official-wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        project:
          - repo: CPBL-baseball
            ref: ${{ github.event.pull_request.head.sha || github.sha }}
          - repo: market-anomaly-dashboard
            ref: refs/pull/21/head
          - repo: aqi-anomaly-dashboard
            ref: refs/pull/19/head
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      AQI_CONSTRAINTS_APPLIED: "1"
    steps:
      - name: Check out integration harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out exact project candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Lily09-project/${{ matrix.project.repo }}
          ref: ${{ matrix.project.ref }}
          path: project
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download this run's official wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: streamlit-1.66.1-official
          path: candidate-wheel
      - name: Run locked install, complete tests, and strict runtime audit
        run: >-
          python scripts/test_streamlit_integration.py
          --repo "${{ matrix.project.repo }}"
          --project project
          --candidate candidate-wheel
          --output integration-result
      - name: Retain integration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ matrix.project.repo }}-${{ matrix.os }}
          path: |
            integration-result/installed.txt
            integration-result/result.json
            integration-result/integration-requirements.txt
          if-no-files-found: error
