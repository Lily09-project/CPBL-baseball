name: CPBL data health

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpbl-data-health
  cancel-in-progress: true

jobs:
  verify-live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -r requirements.lock.txt

      - name: Verify live official CPBL pipeline
        id: live_data
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          set +e
          python run_all.py --mode api 2>&1 | tee "$log_file"
          pipeline_status=${PIPESTATUS[0]}
          set -e

          if [ "$pipeline_status" -eq 0 ]; then
            echo "status=verified" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A scheduled health check must distinguish a temporary upstream
          # block/outage from a product regression. Never turn stale data into
          # a passing verification; defer the dependent checks instead.
          if [ "${{ github.event_name }}" = "schedule" ] \
            && grep -Eiq '(403 Client Error|429 Client Error|[45][0-9]{2} Server Error|ConnectionError|Timeout|Max retries exceeded)' "$log_file"; then
            echo "status=deferred" >> "$GITHUB_OUTPUT"
            echo "::warning::Official CPBL pages were temporarily unavailable; live-data health verification was deferred."
            {
              echo "## Live data health verification deferred"
              echo
              echo "The official CPBL public pages temporarily rejected or could not serve the GitHub-hosted runner."
              echo "No release was marked as freshly verified. Run this workflow manually after the official source is available again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit "$pipeline_status"

      - name: Run product test suite
        if: steps.live_data.outputs.status == 'verified'
        run: python -m pytest -q

      - name: Run release health gate
        if: steps.live_data.outputs.status == 'verified'
        run: python -m src.release_gate

      - name: Verify public release manifest
        if: steps.live_data.outputs.status == 'verified'
        run: python -m src.verify_public_release reports/metrics/public_release_manifest.json

      - name: Summarize verified outputs
        if: steps.live_data.outputs.status == 'verified'
        run: >-
          python -c "import json; import pandas as pd; from pathlib import Path;
          report=json.loads(Path('reports/metrics/data_quality_report.json').read_text(encoding='utf-8-sig'));
          health=json.loads(Path('reports/metrics/release_health.json').read_text(encoding='utf-8-sig'));
          release=json.loads(Path('reports/metrics/public_release_manifest.json').read_text(encoding='utf-8-sig'));
          movements=pd.read_csv('data/processed/player_movements.csv');
          print('quality_status=' + str(report['quality_status']));
          print('release_health=' + str(health['status']));
          print('release_id=' + str(release['release_id']));
          print('players=' + str(report['available_player_count']));
          print('movement_rows=' + str(len(movements)))"
