name: Verified CPBL data refresh

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cpbl-data-refresh
  cancel-in-progress: true

jobs:
  refresh-and-open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked environment
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -r requirements.lock.txt
          python -m pip check

      - name: Refresh and validate official CPBL data
        id: refresh
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          set +e
          python run_all.py --mode api 2>&1 | tee "$log_file"
          refresh_status=${PIPESTATUS[0]}
          set -e

          if [ "$refresh_status" -eq 0 ]; then
            echo "status=refreshed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The official site occasionally rejects GitHub-hosted runner IPs
          # (HTTP 403) or is temporarily unavailable. Do not publish stale
          # data, but keep scheduled maintenance runs green and explicit.
          # Manual runs still fail so an operator gets an actionable signal.
          if [ "${{ github.event_name }}" = "schedule" ] \
            && grep -Eiq '(403 Client Error|429 Client Error|[45][0-9]{2} Server Error|ConnectionError|Timeout|Max retries exceeded)' "$log_file"; then
            echo "status=deferred" >> "$GITHUB_OUTPUT"
            echo "::warning::Official CPBL pages were temporarily unavailable; no data refresh was published."
            {
              echo "## Verified data refresh deferred"
              echo
              echo "The official CPBL public pages temporarily rejected or could not serve the GitHub-hosted runner."
              echo "No processed data or release metadata was changed; the previous verified release remains in place."
              echo "Run this workflow manually after the official source is available again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit "$refresh_status"

      - name: Run release checks
        if: steps.refresh.outputs.status == 'refreshed'
        run: |
          python -m compileall -q app.py src run_all.py
          python -m pytest -q
          python -m src.release_gate
          python -m src.verify_public_release reports/metrics/public_release_manifest.json

      - name: Open pull request for verified outputs
        if: steps.refresh.outputs.status == 'refreshed'
        shell: bash
        env:
          # Prefer an optional least-privilege repository secret. The default
          # GITHUB_TOKEN remains supported when the repository PR setting is on.
          GH_TOKEN: ${{ secrets.CPBL_REFRESH_TOKEN || github.token }}
          IS_SCHEDULED_RUN: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          # checkout deliberately does not persist credentials; configure an
          # ephemeral GitHub CLI helper for the authenticated remote operations
          # below without embedding a token in the repository URL.
          gh auth setup-git
          if git diff --quiet -- data/processed reports/metrics; then
            echo "No verified data changes; no pull request required."
            exit 0
          fi

          # Reuse the newest open bot refresh PR so scheduled updates do not
          # leave one pending pull request and branch per day. Keep older PRs
          # untouched; maintainers can review or close those separately.
          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --limit 100 \
            --json author,headRefName,number,title,url \
            --jq 'map(select(.author.login == "github-actions[bot]" and .title == "chore(data): refresh verified CPBL data" and (.headRefName | startswith("automation/data-refresh-")))) | sort_by(.number) | last | [.headRefName // "", .number // "", .url // ""] | @tsv')"
          branch="automation/data-refresh-${GITHUB_RUN_ID}"
          existing_number=""
          existing_url=""
          if [ -n "$existing_pr" ]; then
            IFS=$'\t' read -r branch existing_number existing_url <<< "$existing_pr"
            echo "Updating existing verified-data pull request #${existing_number}: ${existing_url}"
          fi

          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed reports/metrics
          git commit -m "chore(data): refresh verified CPBL data"

          if [ -n "$existing_number" ]; then
            remote_head="$(git ls-remote --heads origin "refs/heads/$branch" | awk 'NR == 1 { print $1 }')"
            if [ -n "$remote_head" ]; then
              git push --force-with-lease="refs/heads/$branch:$remote_head" --set-upstream origin "$branch"
            else
              git push --set-upstream origin "$branch"
            fi
          else
            git push --set-upstream origin "$branch"
          fi

          if [ -n "$existing_number" ]; then
            echo "Updated existing pull request #${existing_number}; no new pull request was created."
            exit 0
          fi

          set +e
          pr_output="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(data): refresh verified CPBL data" \
            --body "Automated refresh from CPBL official public pages.\n\n- API mode only\n- Data quality report passed before snapshot creation\n- Release gate, public release manifest, and test suite passed\n- Review the generated snapshot, movement, history, analysis validation, and release integrity outputs before merging." 2>&1)"
          pr_status=$?
          set -e
          printf '%s\n' "$pr_output"
          if [ "$pr_status" -ne 0 ]; then
            echo "::warning::Unable to create the verified-data pull request; removing the orphaned refresh branch."
            git push origin --delete "$branch" || echo "::warning::Failed to remove refresh branch $branch"
            if [ "$IS_SCHEDULED_RUN" = "true" ]; then
              {
                echo "## Verified data refresh needs repository attention"
                echo "The data and release checks passed, but GitHub could not create its pull request."
                echo "Enable **Allow GitHub Actions to create and approve pull requests** or configure the optional \`CPBL_REFRESH_TOKEN\` secret, then run this workflow manually."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit "$pr_status"
          fi
