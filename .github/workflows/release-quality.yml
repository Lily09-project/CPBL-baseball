name: Release quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpbl-release-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python pipeline and analytics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked environment
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -r requirements.lock.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src run_all.py tests

      - name: Run tests with analytics coverage gate (Q1 ≥ 90%)
        run: >-
          python -W error -m pytest -q --basetemp "${RUNNER_TEMP}/cpbl-release-pytest"
          --cov=src.analytics --cov=src.export_web --cov-report=term-missing --cov-fail-under=90

      - name: Verify generated public artifacts
        run: |
          python -m src.release_gate
          python -m src.verify_public_release reports/metrics/public_release_manifest.json

      - name: Prove the web export is reproducible (Q7)
        shell: bash
        run: |
          python -m src.export_web --out "${RUNNER_TEMP}/export-a"
          python -m src.export_web --out "${RUNNER_TEMP}/export-b"
          diff -r "${RUNNER_TEMP}/export-a" "${RUNNER_TEMP}/export-b"
          cat "${RUNNER_TEMP}/export-a/manifest.json"

  web:
    name: Web app (types, lint, unit, build, budget, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Export verified data for the web app
        working-directory: .
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -r requirements.lock.txt
          python -m src.export_web

      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check (Q2)
        run: npm run typecheck

      - name: Lint (Q2)
        run: npm run lint

      - name: Unit tests with coverage gate (Q3 ≥ 85%)
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Performance budget (Q6)
        run: npm run size

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: End-to-end journeys, accessibility and security (Q4, Q5, Q8)
        env:
          CI: "1"
        run: npm run e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
